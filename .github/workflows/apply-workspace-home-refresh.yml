name: Apply workspace and homepage refresh

on:
  push:
    branches:
      - feature/workspace-home-seo-refresh

permissions:
  contents: write

jobs:
  apply-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/workspace-home-seo-refresh
          fetch-depth: 0

      - name: Apply product refresh
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f"Missing expected block: {label}")
              return text.replace(old, new, 1)

          workspace_path = Path("app/workspace/page.tsx")
          workspace = workspace_path.read_text()

          workspace = replace_once(
              workspace,
              'const panelLayoutStorageKey = "skycode:workspace-panel-layout:v1";\nconst workspaceLayoutStorageKey = "skycode:workspace-layout-version:v1";',
              'const panelLayoutStorageKey = "skycode:workspace-panel-layout:v1";\nconst workspaceDraftStorageKey = "skycode:workspace-draft:v2";',
              "workspace storage keys",
          )

          workspace = replace_once(
              workspace,
              '  const [layoutVersion, setLayoutVersion] =\n    useState<WorkspaceLayoutVersion>("studio");',
              '  const layoutVersion: WorkspaceLayoutVersion = "studio";',
              "fixed workspace layout",
          )

          workspace = replace_once(
              workspace,
              '  const [onboardingOpen, setOnboardingOpen] = useState(true);',
              '  const [onboardingOpen, setOnboardingOpen] = useState(false);\n  const [workspaceHydrated, setWorkspaceHydrated] = useState(false);',
              "onboarding state",
          )

          workspace = replace_once(
              workspace,
              '  } | null>(null);\n\n  // Multi-user collaborative file locking state',
              '  } | null>(null);\n  const workspaceUndoStackRef = useRef<WorkspaceFiles[]>([]);\n  const workspaceRedoStackRef = useRef<WorkspaceFiles[]>([]);\n  const previousFilesRef = useRef<WorkspaceFiles>(starterFiles);\n  const historyReadyRef = useRef(false);\n  const applyingHistoryRef = useRef(false);\n\n  // Multi-user collaborative file locking state',
              "workspace history refs",
          )

          hydration_pattern = re.compile(
              r'  useEffect\(\(\) => \{\n    const draftValue = window\.sessionStorage\.getItem\(cloudStorageKeys\.draft\);.*?\n  \}, \[\]\);\n\n  useEffect\(\(\) => \{\n    const requestedId',
              re.S,
          )
          hydration_replacement = '''  useEffect(() => {
    const requestedId = new URLSearchParams(window.location.search).get("project");
    const draftValue =
      window.localStorage.getItem(workspaceDraftStorageKey) ??
      window.sessionStorage.getItem(cloudStorageKeys.draft);

    if (draftValue) {
      try {
        const draft = JSON.parse(draftValue) as {
          files?: WorkspaceFiles;
          baselineFiles?: WorkspaceFiles;
          projectId?: string;
          projectName?: string;
          saveStatus?: "Saved" | "Unsaved";
          category?: ProjectCategory | null;
          buildPrompt?: string;
          projectBrief?: string;
        };
        if (
          draft.files &&
          ["index.html", "styles.css", "app.js", "package.json"].every(
            (name) => typeof draft.files?.[name as FileName] === "string",
          )
        ) {
          setFiles(draft.files);
          setPreviewFiles(draft.files);
          setBaselineFiles(draft.baselineFiles ?? draft.files);
        }
        setProjectId(
          typeof draft.projectId === "string" ? draft.projectId : "",
        );
        if (typeof draft.projectName === "string") setProjectName(draft.projectName);
        if (draft.saveStatus === "Saved" || draft.saveStatus === "Unsaved") {
          setSaveStatus(draft.saveStatus);
        }
        if (draft.category) setSelectedCategory(draft.category);
        if (typeof draft.buildPrompt === "string") setBuildPrompt(draft.buildPrompt);
        if (typeof draft.projectBrief === "string") setProjectBrief(draft.projectBrief);
        setOnboardingOpen(false);
      } catch {
        window.localStorage.removeItem(workspaceDraftStorageKey);
      }
    } else if (!requestedId) {
      setOnboardingOpen(true);
    }

    window.sessionStorage.removeItem(cloudStorageKeys.draft);
    window.localStorage.removeItem("skycode:workspace-layout-version:v1");
    setWorkspaceHydrated(true);

    void getManagedAiStatus()
      .then((status) => {
        setCloudAuthenticated(status.authenticated);
        setCloudConfigured(status.configured);
        setCloudConnected(status.available);
        setCloudModel(status.model ?? "");
        if (status.available) setAiMode("cloud");
      })
      .catch(() => {
        setCloudAuthenticated(false);
        setCloudConfigured(false);
        setCloudConnected(false);
        setCloudModel("");
      });
  }, []);

  useEffect(() => {
    const requestedId'''
          workspace, count = hydration_pattern.subn(hydration_replacement, workspace, count=1)
          if count != 1:
              raise SystemExit("Could not replace workspace hydration block")

          saved_layout_effect = '''  useEffect(() => {
    const savedVersion = window.localStorage.getItem(
      workspaceLayoutStorageKey,
    );
    if (savedVersion === "studio" || savedVersion === "classic") {
      setLayoutVersion(savedVersion);
    }
  }, []);

'''
          workspace = replace_once(
              workspace,
              saved_layout_effect,
              "",
              "legacy layout persistence",
          )

          panel_effect_marker = '''  useEffect(() => {
    if (!panelLayoutReady) return;
    window.localStorage.setItem(
      panelLayoutStorageKey,
      JSON.stringify(panelSizes),
    );
  }, [panelLayoutReady, panelSizes]);
'''
          autosave_effects = panel_effect_marker + '''

  useEffect(() => {
    if (!workspaceHydrated) return;
    const timer = window.setTimeout(() => {
      try {
        window.localStorage.setItem(
          workspaceDraftStorageKey,
          JSON.stringify({
            files,
            baselineFiles,
            projectId,
            projectName,
            saveStatus: saveStatus === "Saving" ? "Unsaved" : saveStatus,
            category: selectedCategory,
            buildPrompt,
            projectBrief,
          }),
        );
      } catch {
        // Browser storage can be unavailable in private or restricted contexts.
      }
    }, 120);
    return () => window.clearTimeout(timer);
  }, [
    baselineFiles,
    buildPrompt,
    files,
    projectBrief,
    projectId,
    projectName,
    saveStatus,
    selectedCategory,
    workspaceHydrated,
  ]);

  useEffect(() => {
    if (
      !workspaceHydrated ||
      onboardingOpen ||
      !selectedCategory ||
      aiWorking
    ) {
      return;
    }
    setSaveStatus("Unsaved");
    const timer = window.setTimeout(() => {
      void saveProject(true);
    }, 900);
    return () => window.clearTimeout(timer);
  }, [
    aiWorking,
    files,
    onboardingOpen,
    projectName,
    selectedCategory,
    workspaceHydrated,
  ]);

  useEffect(() => {
    if (!workspaceHydrated) return;
    if (!historyReadyRef.current) {
      historyReadyRef.current = true;
      previousFilesRef.current = files;
      return;
    }
    if (applyingHistoryRef.current) {
      applyingHistoryRef.current = false;
      previousFilesRef.current = files;
      return;
    }
    if (JSON.stringify(previousFilesRef.current) === JSON.stringify(files)) return;
    workspaceUndoStackRef.current = [
      ...workspaceUndoStackRef.current.slice(-49),
      previousFilesRef.current,
    ];
    workspaceRedoStackRef.current = [];
    previousFilesRef.current = files;
  }, [files, workspaceHydrated]);
'''
          workspace = replace_once(
              workspace,
              panel_effect_marker,
              autosave_effects,
              "autosave and history effects",
          )

          old_persist = '''  function persistWorkspaceDraft() {
    try {
      window.sessionStorage.setItem(
        cloudStorageKeys.draft,
        JSON.stringify({
          files,
          baselineFiles,
          projectId,
          projectName,
          saveStatus: saveStatus === "Saving" ? "Unsaved" : saveStatus,
          category: selectedCategory,
          buildPrompt,
          projectBrief,
          onboardingOpen,
        }),
      );
      return true;
    } catch {
      return false;
    }
  }

  async function saveProject() {'''
          new_persist = '''  function persistWorkspaceDraft() {
    try {
      const draft = JSON.stringify({
        files,
        baselineFiles,
        projectId,
        projectName,
        saveStatus: saveStatus === "Saving" ? "Unsaved" : saveStatus,
        category: selectedCategory,
        buildPrompt,
        projectBrief,
      });
      window.localStorage.setItem(workspaceDraftStorageKey, draft);
      window.sessionStorage.setItem(cloudStorageKeys.draft, draft);
      return true;
    } catch {
      return false;
    }
  }

  async function saveProject(silent = false) {'''
          workspace = replace_once(workspace, old_persist, new_persist, "persistent draft helper")

          workspace = replace_once(
              workspace,
              '''      if (response.status === 401) {
        setSaveStatus("Unsaved");
        if (!persistWorkspaceDraft()) {
          throw new Error(
            "Sign-in is required, and this browser could not preserve the draft.",
          );
        }
        const returnTo = `${window.location.pathname}${window.location.search}`;
        window.location.assign(
          `/signin-with-chatgpt?return_to=${encodeURIComponent(returnTo)}`,
        );
        return;
      }''',
              '''      if (response.status === 401) {
        setSaveStatus("Unsaved");
        if (!persistWorkspaceDraft()) {
          throw new Error(
            "Sign-in is required, and this browser could not preserve the draft.",
          );
        }
        if (silent) return;
        const returnTo = `${window.location.pathname}${window.location.search}`;
        window.location.assign(
          `/signin-with-chatgpt?return_to=${encodeURIComponent(returnTo)}`,
        );
        return;
      }''',
              "silent autosave authentication",
          )
          workspace = replace_once(
              workspace,
              '''      setSaveStatus("Saved");
      showToast("Project saved securely");
    } catch (error) {
      setSaveStatus("Unsaved");
      showToast(error instanceof Error ? error.message : "Project could not be saved.");
    }''',
              '''      setSaveStatus("Saved");
      if (!silent) showToast("Project synced securely");
    } catch (error) {
      setSaveStatus("Unsaved");
      if (!silent) {
        showToast(error instanceof Error ? error.message : "Project could not be saved.");
      }
    }''',
              "silent autosave feedback",
          )

          workspace = replace_once(
              workspace,
              '''  function switchLayout(version: WorkspaceLayoutVersion) {
    setLayoutVersion(version);
    window.localStorage.setItem(workspaceLayoutStorageKey, version);
    showToast(
      version === "studio"
        ? "Version 1 studio layout"
        : "Version 2 classic layout",
    );
  }

''',
              "",
              "layout switch function",
          )

          workspace = replace_once(
              workspace,
              '''  function openAiAssistant() {
    if (!selectedCategory) {
      openBuildWizard();
      return;
    }
    setOnboardingOpen(false);
    setMobileView("ai");
    window.requestAnimationFrame(() => {
      document
        .querySelector<HTMLTextAreaElement>(".prompt-box textarea")
        ?.focus();
    });
  }

''',
              "",
              "Sky AI opener",
          )

          history_insert_marker = '''  function selectPreviewSection(index: number) {'''
          history_functions = '''  function undoWorkspaceChange() {
    const previous = workspaceUndoStackRef.current.at(-1);
    if (!previous) {
      showToast("No change to undo.");
      return;
    }
    workspaceUndoStackRef.current = workspaceUndoStackRef.current.slice(0, -1);
    workspaceRedoStackRef.current = [
      ...workspaceRedoStackRef.current.slice(-49),
      files,
    ];
    applyingHistoryRef.current = true;
    setFiles(previous);
    setPreviewFiles(previous);
    setSaveStatus("Unsaved");
    setRunCount((count) => count + 1);
    resetSectionInspectorState();
    showToast("Change undone");
  }

  function redoWorkspaceChange() {
    const next = workspaceRedoStackRef.current.at(-1);
    if (!next) {
      showToast("No change to redo.");
      return;
    }
    workspaceRedoStackRef.current = workspaceRedoStackRef.current.slice(0, -1);
    workspaceUndoStackRef.current = [
      ...workspaceUndoStackRef.current.slice(-49),
      files,
    ];
    applyingHistoryRef.current = true;
    setFiles(next);
    setPreviewFiles(next);
    setSaveStatus("Unsaved");
    setRunCount((count) => count + 1);
    resetSectionInspectorState();
    showToast("Change restored");
  }

  useEffect(() => {
    function handleWorkspaceShortcut(event: KeyboardEvent) {
      if (!(event.metaKey || event.ctrlKey) || event.altKey) return;
      const key = event.key.toLowerCase();
      if (key !== "z" && key !== "y") return;
      const target = event.target as HTMLElement | null;
      if (
        target?.matches("input, textarea, [contenteditable='true']")
      ) {
        return;
      }
      event.preventDefault();
      if (key === "y" || (key === "z" && event.shiftKey)) {
        redoWorkspaceChange();
      } else {
        undoWorkspaceChange();
      }
    }
    window.addEventListener("keydown", handleWorkspaceShortcut);
    return () => window.removeEventListener("keydown", handleWorkspaceShortcut);
  }, [files]);

'''
          workspace = replace_once(
