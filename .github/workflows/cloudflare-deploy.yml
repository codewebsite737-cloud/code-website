name: Test and deploy SkyCode

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skycode-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-deploy:
    name: Test and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build and test
        run: npm test

      - name: Apply D1 migrations and deploy
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          # The first deploy provisions and binds D1 when the account has no DB yet.
          npx wrangler deploy
          npx wrangler d1 migrations apply DB --remote
          # Deploy again after the schema is ready so the release is immediately usable.
          npx wrangler deploy
          if [ -n "$OPENROUTER_API_KEY" ]; then
            printf '%s' "$OPENROUTER_API_KEY" | npx wrangler secret put OPENROUTER_API_KEY
          else
            echo "OPENROUTER_API_KEY is not configured; Instant Builder remains available."
          fi

      - name: Verify production health
        if: github.event_name != 'pull_request'
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error \
              https://code-website.codewebsite737.workers.dev/api/health; then
              exit 0
            fi
            sleep 5
          done
          exit 1
