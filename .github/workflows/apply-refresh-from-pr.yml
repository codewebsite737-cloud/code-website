name: Apply refresh from pull request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/workspace-home-seo-refresh'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/workspace-home-seo-refresh
          fetch-depth: 0
      - name: Run embedded refresh script
        run: |
          python <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/apply-workspace-home-refresh.yml').read_text()
          marker = "          python <<'PY'\n"
          end_marker = "\n          PY\n"
          script = source.split(marker, 1)[1].split(end_marker, 1)[0]
          exec(compile(textwrap.dedent(script), 'workspace-refresh.py', 'exec'))
          PY
          rm -f .github/workflows/apply-refresh-from-pr.yml
          rm -f .github/workflows/.refresh-trigger
      - name: Commit refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh workspace persistence, homepage, and SEO"
          git push origin HEAD:feature/workspace-home-seo-refresh
